<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<title>Höstläger Kläppen 2026 · SFS</title>
<link rel="icon" href="logo.png">
<style>
:root{
  --bg:#000000; --card:#121212; --ink:#ffffff; --muted:#b3b3b3; --line:#2b2b2b;
  --red:#ff0000; --gold:#f2b233; --blue:#4c8dff; --green:#3ddc84;
  --svart:#e6e6e6; --rodplus:#ff7a3d; --rod:#ff4d4d; --bla:#5aa2ff; --sb:#b48cff;
  --display: Arial, "Helvetica Neue", Helvetica, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--display);-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:3px solid var(--red)}
header img{width:56px;height:56px;object-fit:contain;flex:none}
header h1{font-size:1.4rem;line-height:1.15;margin:0;font-weight:900;letter-spacing:-.01em;text-transform:uppercase}
header p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.tabs{display:flex;gap:6px;margin:16px 0 12px}
.tab{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:11px 8px;border-radius:10px;font:700 .95rem var(--display);cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search input{width:100%;font:1.05rem var(--display);padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.search input:focus{outline:2px solid var(--red);outline-offset:1px}
.list{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 13px;font:.95rem var(--display);cursor:pointer;white-space:nowrap}
.chip:hover,.chip:focus{border-color:var(--red)}
.chip .dot{margin-left:4px}
.sect{margin:16px 0 4px;font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.back{display:inline-block;margin:14px 0 0;border:0;background:transparent;color:var(--ink);font:700 1rem var(--display);padding:6px 0;cursor:pointer}
.back:hover{color:var(--red)}
.who{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--red);border-radius:14px;padding:14px;margin:10px 0}
.who h2{margin:0 0 4px;font-size:1.35rem;font-weight:900}
.who .meta{color:var(--muted);font-size:.95rem}
.day{margin:24px 0 8px;font-size:1.05rem;font-weight:900;text-transform:uppercase;letter-spacing:.03em;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:1;border-bottom:1px solid var(--line)}
.ev{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--ink);border-radius:12px;padding:12px 14px;margin:8px 0}
.ev.common{border-left-color:#555}
.ev.klappen{border-left-color:var(--blue)}
.ev .t{font-weight:900;font-variant-numeric:tabular-nums}
.ev .meet{display:inline-block;margin-left:6px;font-size:.82rem;color:#000;background:var(--gold);border-radius:6px;padding:1px 7px;font-weight:700}
.ev h3{margin:3px 0 2px;font-size:1.02rem}
.ev .place{color:var(--muted);font-size:.92rem}
.ev .d{margin-top:6px;font-size:.93rem}
.ev .y{margin-top:6px;font-size:.93rem;color:var(--green)}
.ev .for{margin-top:6px;font-size:.85rem;color:var(--muted)}
.tag{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border:1px solid currentColor;border-radius:5px;padding:0 5px;margin-left:6px;vertical-align:2px}
.tag.k{color:var(--blue)} .tag.o{color:var(--muted)}
details{margin-top:6px}
summary{cursor:pointer;color:var(--ink);font-size:.9rem;text-decoration:underline;text-underline-offset:3px}
.roster{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.roster span{font-size:.86rem;background:#1f1f1f;border-radius:6px;padding:2px 7px}
.roster span.me{outline:2px solid var(--red)}
.lv-Svart{color:var(--svart)} .lv-Rödplus{color:var(--rodplus)} .lv-Röd{color:var(--rod)} .lv-Blå{color:var(--bla)} .lv-Snowboard{color:var(--sb)}
.note{background:#1a1406;border:1px solid #4a3a10;color:var(--ink);border-radius:10px;padding:10px 12px;font-size:.92rem;margin:10px 0}
footer{margin-top:28px;color:var(--muted);font-size:.82rem;border-top:1px solid var(--line);padding-top:12px}
.empty{color:var(--muted);text-align:center;padding:24px 0}
[hidden]{display:none!important}
</style>
</head>

<script>
// Live data: the "Höstläger app" tab of the camp sheet, published to the web as CSV.
const SHEET_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSUz4p82kOloUyYgmI979we7-jrmMwVZtIzzddSnjRBGb1wuD2Tm6W-aFBgHRaqWgyELeyob6Vki4nr/pub?gid=1248964458&single=true&output=csv";

const $ = s=>document.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const slug = s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");
const mins = t=>{const m=/^(\d{1,2})[:.](\d{2})/.exec(t||"");return m?(+m[1])*60+(+m[2]):9999};
const hhmm = t=>{const m=/^(\d{1,2})[:.](\d{2})/.exec(t||"");return m?m[1].padStart(2,"0")+":"+m[2]:(t||"")};
const LV = {"Svart":"⚫","Röd+":"🔴+","Röd":"🔴","Blå":"🔵","Snowboard":"🏂"};
const lvClass = l => "lv-"+String(l).replace("+","plus");
const DAYS = [["fri","Friday 2 October"],["sat","Saturday 3 October"],["sun","Sunday 4 October"]];

function parseCSV(text){
  const rows=[]; let row=[], f="", q=false;
  for (let i=0;i<text.length;i++){
    const c=text[i];
    if (q){ if (c==='"'){ if (text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if (c==='"') q=true;
    else if (c===','){ row.push(f); f=""; }
    else if (c==='\n'){ row.push(f); rows.push(row); row=[]; f=""; }
    else if (c!=='\r') f+=c;
  }
  if (f!==""||row.length){ row.push(f); rows.push(row); }
  return rows.map(r=>r.map(x=>x.trim()));
}
function table(rows, firstHeader){
  const h = rows.findIndex(r=>r[0]===firstHeader);
  if (h<0) return [];
  // Header names are matched loosely: "Group (named by coach)" reads as "group".
  const head = rows[h].map(x=>x.toLowerCase().replace(/\s*\(.*$/,"").trim());
  const out=[];
  for (let i=h+1;i<rows.length;i++){
    const r=rows[i];
    if (!r[0] || /^[A-Z]{4,}$/.test(r[0])) break;
    const o={}; head.forEach((k,j)=>o[k]=r[j]||""); out.push(o);
  }
  return out;
}

let PEOPLE=[], SESSIONS=[], GROUPS={};
function load(rows){
  PEOPLE = table(rows,"Name").filter(p=>p.name).map(p=>{
    const role=(p.role||"").toLowerCase();
    const daysRaw = (p[Object.keys(p).find(k=>k.startsWith("days"))]||"").toLowerCase();
    return {id:slug(p.name), name:p.name, role, disc:(p.discipline||"").toLowerCase(), lvl:p.level, group:p.group,
      sat: role==="youth" ? (!daysRaw || daysRaw.includes("sat") || daysRaw.includes("lör")) : false,
      sun: role==="youth" ? (!daysRaw || daysRaw.includes("sun") || daysRaw.includes("sön")) : false,
      daysSet: !!daysRaw};
  });
  SESSIONS = table(rows,"Day").filter(s=>s.title).map(s=>({day:(s.day||"").slice(0,3).toLowerCase(), start:hhmm(s.start), end:hhmm(s.end), meet:hhmm(s.meet),
    title:s.title, place:s.place, kind:(s.type||"camp").toLowerCase(), optional:/^(y|yes|ja|x)/i.test(s.optional||""), who:s.who||"", d:s.details, youth:s["youth note"]}));
  GROUPS={};
  PEOPLE.forEach(p=>{ if(!p.group) return; const g=GROUPS[p.group]||(GROUPS[p.group]={name:p.group,riders:[],coaches:[]}); (p.role==="coach"?g.coaches:p.role==="rider"?g.riders:[]).push(p); });
}
function tokens(s){ return s.who.split(",").map(t=>t.trim()).filter(Boolean); }
function includes(s, p){
  return tokens(s).some(t=>{
    const k=t.toLowerCase();
    if (k==="everyone") return p.role==="rider"||p.role==="coach";
    if (k==="riders") return p.role==="rider";
    if (k==="coaches") return p.role==="coach";
    if (k==="youth") return p.role==="youth";
    if (k==="youth-sat") return p.role==="youth" && p.sat;
    if (k==="youth-sun") return p.role==="youth" && p.sun;
    if (k.startsWith("group:")) return (p.role==="rider"||p.role==="coach") && p.group && p.group.toLowerCase()===t.slice(6).trim().toLowerCase();
    return t===p.name;
  });
}
function forLine(s){
  const t=tokens(s), g=t.find(x=>x.toLowerCase().startsWith("group:"));
  if (g){ const n=g.slice(6).trim(); return /snowboard/i.test(n) ? "Snowboard group" : `${n}'s group`; }
  const ks=t.map(x=>x.toLowerCase()); const parts=[];
  if (ks.includes("everyone")) parts.push("Everyone"); else { if (ks.includes("riders")) parts.push("All riders"); if (ks.includes("coaches")) parts.push("Coaches"); }
  if (ks.some(k=>k.startsWith("youth"))) parts.push("Malung youth trainers");
  return parts.join(" + ");
}
function rosterOf(s){
  const t=tokens(s), g=t.find(x=>x.toLowerCase().startsWith("group:"));
  if (g){ const G=GROUPS[g.slice(6).trim()]; return G?G.riders:[]; }
  return PEOPLE.filter(p=>p.role==="rider" && t.includes(p.name));
}

function card(s, me){
  const time = s.end ? `${s.start}–${s.end}` : s.start;
  const meet = s.meet && s.meet!==s.start ? `<span class="meet">meet ${s.meet}</span>` : "";
  const tag = s.kind==="klappen" ? `<span class="tag k">Kläppen</span>` : (s.optional?`<span class="tag o">optional</span>`:"");
  const cls = s.kind==="klappen"?"klappen":(s.kind==="common"?"common":"");
  let extra="";
  if (me && me.role==="youth" && s.youth) extra += `<div class="y">${esc(s.youth)}</div>`;
  if (me && me.role==="youth" && !me.daysSet && /youth-(sat|sun)/i.test(s.who)) extra += `<div class="for">If you picked this day in the poll.</div>`;
  const ros = rosterOf(s);
  const isAll = tokens(s).some(x=>["everyone","riders"].includes(x.toLowerCase()));
  if (!me) { const f=forLine(s); if (f) extra += `<div class="for">For: ${esc(f)}</div>`; }
  if (ros.length && !isAll) extra += `<details><summary>Riders (${ros.length})</summary><div class="roster">${ros.map(r=>`<span class="${me&&me.id===r.id?"me":""}">${esc(r.name)} <span class="${lvClass(r.lvl)}">${LV[r.lvl]||""}</span></span>`).join("")}</div></details>`;
  return `<div class="ev ${cls}"><div class="t">${esc(time)}${meet}</div><h3>${esc(s.title)}${tag}</h3>${s.place?`<div class="place">${esc(s.place)}</div>`:""}${s.d?`<div class="d">${esc(s.d)}</div>`:""}${extra}</div>`;
}
function sortKey(s){ return s.kind==="camp" && s.meet ? Math.min(mins(s.meet),mins(s.start)) : mins(s.start); }
function days(list, me){
  let html="";
  for (const [d,label] of DAYS){
    const evs=list.filter(s=>s.day===d).sort((a,b)=>sortKey(a)-sortKey(b)||mins(a.start)-mins(b.start));
    if (evs.length) html += `<div class="day">${label}</div>` + evs.map(s=>card(s,me)).join("");
  }
  return html || `<div class="empty">Nothing scheduled.</div>`;
}

function renderPicker(){
  const f=slug($("#q").value||"");
  const ok=p=>!f||slug(p.name).includes(f);
  let last=""; try{ last=localStorage.getItem("me")||""; }catch(e){}
  const lp=!f&&PEOPLE.find(p=>p.id===last);
  const chip=p=>`<button class="chip" data-id="${p.id}">${esc(p.name)}${p.role==="rider"?` <span class="dot ${lvClass(p.lvl)}">${LV[p.lvl]||""}</span>`:""}</button>`;
  const sec=(label,arr)=>{const m=arr.filter(ok);return m.length?`<div class="sect">${label}</div><div class="list">${m.map(chip).join("")}</div>`:""};
  const riders=PEOPLE.filter(p=>p.role==="rider").sort((a,b)=>a.name.localeCompare(b.name,"sv"));
  const html=(lp?`<div class="sect">Last viewed</div><div class="list"><button class="chip" data-id="${lp.id}">${esc(lp.name)} →</button></div>`:"")
    + sec("Riders",riders) + sec("Coaches",PEOPLE.filter(p=>p.role==="coach")) + sec("Malung youth trainers",PEOPLE.filter(p=>p.role==="youth"));
  $("#picker").innerHTML = html || `<div class="empty">No name matches “${esc($("#q").value)}”.</div>`;
}
function showPerson(p){
  $("#picker").hidden=true;
  let meta="";
  if (p.role==="rider"){ const g=GROUPS[p.group]; meta=`Level: <b class="${lvClass(p.lvl)}">${esc(p.lvl)} ${LV[p.lvl]||""}</b> (${esc(p.disc)})${g&&g.coaches.length?`<br>Coach${g.coaches.length>1?"es":""}: ${esc(g.coaches.map(c=>c.name).join(", "))}`:""}`; }
  else if (p.role==="coach"){ const g=GROUPS[p.group]; meta=`Coach${g?` · ${g.riders.length} riders`:""}`; }
  else { meta = `Malung youth trainer · ${p.daysSet ? [p.sat&&"Saturday 10:00–13:30", p.sun&&"Sunday 13:00–15:00"].filter(Boolean).join(" and ") : "Saturday 10:00–13:30 and/or Sunday 13:00–15:00 — whichever you picked in the poll"}`; }
  const mine=SESSIONS.filter(s=>includes(s,p));
  const roster = p.role==="coach" && GROUPS[p.group] ? `<div class="note">Your riders: ${GROUPS[p.group].riders.map(r=>`${esc(r.name)} ${LV[r.lvl]||""}`).join(", ")}</div>` : "";
  $("#person").innerHTML=`<button class="back" id="back">← All names</button><div class="who"><h2>${esc(p.name)}</h2><div class="meta">${meta}</div></div>${roster}${days(mine,p)}`;
  $("#back").onclick=()=>{ if(history.state&&history.state.p) history.back(); else go(""); };
}
function showList(){ $("#person").innerHTML=""; $("#picker").hidden=false; renderPicker(); }
function go(id){ try{ history.pushState(id?{p:id}:{}, "", id?`#${id}`:location.pathname+location.search); }catch(e){ location.hash=id; } route(); }
function route(){
  const id=location.hash.slice(1), p=PEOPLE.find(x=>x.id===id);
  if (p){ try{ localStorage.setItem("me",id); }catch(e){} showPerson(p); window.scrollTo(0,0); } else showList();
}
function renderAll(){ $("#view-all").innerHTML=`<div class="note">Everything at once. Pick your name under <b>My schedule</b> to see only your own sessions.</div>`+days(SESSIONS,null); }
function tab(which){ const me=which==="me"; $("#tab-me").setAttribute("aria-selected",me); $("#tab-all").setAttribute("aria-selected",!me); $("#view-me").hidden=!me; $("#view-all").hidden=me; if(!me) renderAll(); }

$("#tab-me").onclick=()=>tab("me");
$("#tab-all").onclick=()=>tab("all");
$("#q").addEventListener("input",()=>{ if(location.hash){ try{ history.replaceState({},"",location.pathname+location.search); }catch(e){} } showList(); });
$("#picker").addEventListener("click",e=>{ const b=e.target.closest(".chip"); if(!b) return; $("#q").value=""; go(b.dataset.id); });
window.addEventListener("popstate",route);
window.addEventListener("hashchange",route);

function start(text, source){
  load(parseCSV(text));
  if (!PEOPLE.length || !SESSIONS.length) return false;
  $("#status").textContent = source;
  route(); if (!$("#view-all").hidden) renderAll();
  return true;
}
(async ()=>{
  let cached=""; try{ cached=localStorage.getItem("sheet")||""; }catch(e){}
  const snap=$("#snapshot").textContent.trim();
  // Show something immediately, then refresh from the live sheet.
  if (!(cached && start(cached,"Showing the last loaded schedule — refreshing…")) && snap) start(snap,"Showing the built-in schedule — refreshing…");
  try{
    const r=await fetch(SHEET_CSV+"&t="+Date.now(),{cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    const t=await r.text();
    if (start(t,"Live from the camp sheet · loaded "+new Date().toLocaleTimeString("sv-SE",{hour:"2-digit",minute:"2-digit"}))) { try{ localStorage.setItem("sheet",t); }catch(e){} }
  }catch(e){
    if (!PEOPLE.length) $("#picker").innerHTML=`<div class="empty">Couldn't load the schedule. Check your connection and reload.</div>`;
    else $("#status").textContent += " (couldn't reach the live sheet)";
  }
})();
</script>
</body>
</html>
